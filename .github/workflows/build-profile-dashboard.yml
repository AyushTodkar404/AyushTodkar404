name: Build GitHub Profile Dashboard

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate dynamic projects, achievements and activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import html
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]
          out = Path("profile")
          out.mkdir(exist_ok=True)

          query = """
          query($login:String!) {
            user(login:$login) {
              login
              followers { totalCount }
              repositories(
                first: 100
                ownerAffiliations: OWNER
                privacy: PUBLIC
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {
                totalCount
                nodes {
                  name
                  description
                  url
                  pushedAt
                  updatedAt
                  isFork
                  isArchived
                  stargazerCount
                  forkCount
                  primaryLanguage { name }
                  languages(first: 6, orderBy: {field: SIZE, direction: DESC}) {
                    edges { size node { name } }
                  }
                }
              }
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          body = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=body,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "github-profile-dashboard"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          if payload.get("errors"):
              raise RuntimeError(payload["errors"])

          user = payload["data"]["user"]
          repos = user["repositories"]["nodes"]
          contributions = user["contributionsCollection"]
          calendar = contributions["contributionCalendar"]

          public_repos = user["repositories"]["totalCount"]
          followers = user["followers"]["totalCount"]
          stars = sum(repo["stargazerCount"] for repo in repos)

          days = []
          for week in calendar["weeks"]:
              days.extend(week["contributionDays"])
          days.sort(key=lambda item: item["date"])

          streak = 0
          for day in reversed(days):
              if day["contributionCount"] > 0:
                  streak += 1
              elif streak:
                  break

          total_contrib = calendar["totalContributions"]
          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          prs = contributions["totalPullRequestContributions"]
          reviews = contributions["totalPullRequestReviewContributions"]

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def shell(width, height, body):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" '
                  f'height="{height}" viewBox="0 0 {width} {height}">'
                  '<rect width="100%" height="100%" rx="18" fill="#0D1117"/>'
                  f'<rect x="1" y="1" width="{width-2}" height="{height-2}" '
                  f'rx="17" fill="none" stroke="#30363D"/>'
                  f'{body}</svg>'
              )

          # ---------------------------------------------------------
          # ACHIEVEMENTS — same visual treatment as the current README
          # ---------------------------------------------------------
          achievements = [
              ("CONTRIBUTOR", total_contrib >= 1, f"{total_contrib:,} contributions"),
              ("BUILDER", public_repos >= 5, f"{public_repos} public repos"),
              ("STAR POWER", stars >= 10, f"{stars} stars"),
              ("COMMUNITY", followers >= 5, f"{followers} followers"),
              ("COMMITTER", commits >= 50, f"{commits} commits"),
              ("STREAK", streak >= 7, f"{streak} day streak"),
          ]

          trophy = (
              '<text x="22" y="30" fill="#00F5FF" font-size="17" '
              'font-family="Arial" font-weight="700">ACHIEVEMENTS</text>'
          )

          for index, (label, unlocked, detail) in enumerate(achievements):
              x = 22 + (index % 3) * 164
              y = 55 + (index // 3) * 92
              stroke = "#FF2BD6" if unlocked else "#30363D"
              icon = "★" if unlocked else "○"
              trophy += (
                  f'<rect x="{x}" y="{y}" width="145" height="72" rx="12" '
                  f'fill="#11161D" stroke="{stroke}"/>'
                  f'<text x="{x+16}" y="{y+25}" fill="{stroke}" font-size="18" '
                  f'font-family="Arial">{icon}</text>'
                  f'<text x="{x+42}" y="{y+24}" fill="#E6EDF3" font-size="11" '
                  f'font-family="Arial" font-weight="700">{esc(label)}</text>'
                  f'<text x="{x+16}" y="{y+48}" fill="#8B949E" font-size="10" '
                  f'font-family="Arial">{esc(detail)}</text>'
              )

          (out / "achievements.svg").write_text(
              shell(520, 250, trophy), encoding="utf-8"
          )

          # ---------------------------------------------------------
          # ACTIVITY — same visual treatment as the current dashboard
          # ---------------------------------------------------------
          recent = days[-90:] if len(days) > 90 else days
          width, height = 760, 260
          left, right, top, bottom = 42, 20, 58, 38
          plot_w = width - left - right
          plot_h = height - top - bottom
          max_value = max([d["contributionCount"] for d in recent] + [1])

          points = []
          circles = []

          for index, day in enumerate(recent):
              x = left + index * plot_w / max(1, len(recent) - 1)
              y = top + plot_h - (
                  day["contributionCount"] / max_value
              ) * plot_h
              points.append(f"{x:.1f},{y:.1f}")
              if day["contributionCount"]:
                  circles.append(
                      f'<circle cx="{x:.1f}" cy="{y:.1f}" r="2.2" fill="#FF2BD6"/>'
                  )

          activity = (
              f'<text x="24" y="31" fill="#00F5FF" font-size="17" '
              f'font-family="Arial" font-weight="700">CONTRIBUTION ACTIVITY · LAST {len(recent)} DAYS</text>'
              f'<line x1="{left}" y1="{top+plot_h}" x2="{width-right}" '
              f'y2="{top+plot_h}" stroke="#30363D"/>'
              f'<line x1="{left}" y1="{top}" x2="{left}" '
              f'y2="{top+plot_h}" stroke="#30363D"/>'
              f'<polyline points="{" ".join(points)}" fill="none" '
              f'stroke="#7C3AED" stroke-width="3"/>'
              + "".join(circles)
              + f'<text x="{left}" y="{height-12}" fill="#8B949E" '
              f'font-size="10" font-family="Arial">Older</text>'
              + f'<text x="{width-right}" y="{height-12}" text-anchor="end" '
              f'fill="#8B949E" font-size="10" font-family="Arial">Recent</text>'
          )

          (out / "activity.svg").write_text(
              shell(width, height, activity), encoding="utf-8"
          )

          # ---------------------------------------------------------
          # PROJECTS — same 2-column card/table structure as the
          # user's existing README, but generated from live repos.
          # ---------------------------------------------------------

          projects = [
           repo for repo in repos
           if not repo["isFork"]
           and not repo["isArchived"]
          and repo["name"].lower() != username.lower()
          ]

          projects.sort(
           key=lambda repo: (
           repo["pushedAt"] or repo["updatedAt"] or ""
          ),
           reverse=True
         )

# ALL eligible public repositories are displayed.


          cards = []

          for repo in projects:
              name = esc(repo["name"])
              description = esc(
                  repo["description"] or
                  "A project built and maintained as part of my development journey."
              )
              url = esc(repo["url"])
              language = esc(
                  (repo["primaryLanguage"] or {}).get("name", "Mixed")
              )

              language_tags = [
                  edge["node"]["name"]
                  for edge in repo["languages"]["edges"]
              ]
              language_tags = language_tags[:4]

              if not language_tags:
                  language_tags = [language]

              tags = " ".join(
                  f"<code>{esc(tag)}</code>" for tag in language_tags
              )

              card = f"""
          <td width="50%" valign="top">

          <h3>🚀 {name}</h3>

          <p>
          {description}
          </p>

          <p>
          <b>Focus:</b><br>
          {tags}
          </p>

          <p>
          ⭐ {repo["stargazerCount"]}
          &nbsp;&nbsp;
          🍴 {repo["forkCount"]}
          &nbsp;&nbsp;
          <code>{language}</code>
          </p>

          <p>
          <a href="{url}">
          <b>🔗 View Repository →</b>
          </a>
          </p>

          </td>
          """
              cards.append(card.strip())

          rows = []

          for index in range(0, len(cards), 2):
              row = cards[index:index + 2]

              if len(row) == 1:
                  row.append(
                      '<td width="50%" valign="top"></td>'
                  )

              rows.append(
                  "<tr>\n\n"
                  + "\n\n".join(row)
                  + "\n\n</tr>"
              )

          if rows:
              project_html = (
                  "<table>\n\n"
                  + "\n\n".join(rows)
                  + "\n\n</table>"
              )
          else:
              project_html = (
                  "<p>No public projects found yet.</p>"
              )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          start_marker = "<!-- DYNAMIC_PROJECTS_START -->"
          end_marker = "<!-- DYNAMIC_PROJECTS_END -->"

          if start_marker not in readme or end_marker not in readme:
              raise RuntimeError(
                  "README.md is missing the dynamic project markers."
              )

          before = readme.split(start_marker, 1)[0]
          after = readme.split(end_marker, 1)[1]

          readme = (
              before
              + start_marker
              + "\n\n"
              + project_html
              + "\n\n"
              + end_marker
              + after
          )

          readme_path.write_text(readme, encoding="utf-8")

          print("Dynamic profile update complete.")
          print(f"Repositories discovered: {len(projects)}")
          print(f"Total contributions: {total_contrib}")
          print(f"Current streak: {streak} days")
          print(f"Public repositories: {public_repos}")
          print(f"Stars: {stars}")
          print(f"Followers: {followers}")
          print(f"Commits: {commits}")
          print(f"Issues: {issues}")
          print(f"Pull requests: {prs}")
          print(f"Reviews: {reviews}")
          PY

      - name: Commit dashboard and dynamic projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/achievements.svg profile/activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update GitHub profile dashboard"
          git push
